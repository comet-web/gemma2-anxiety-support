name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-all-MiniLM-L6-v2
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + NeMo Guardrails integration tests
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
        run: pytest -q
      - name: Steering regression eval (CPU tiers, held-out prompts)
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
        run: python evaluation/eval_safety.py --target rails-offline --split test --out-dir ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: rails-offline-eval
          path: ci-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t anxiety-support-api:ci .
      - name: Validate compose file
        run: docker compose config -q
