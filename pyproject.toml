[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anxiety-support"
version = "0.1.0"
description = "Gemma-2 CBT anxiety-support assistant: QLoRA fine-tune, NeMo Guardrails + Llama Guard safety layer, agentic CBT session controller, served via FastAPI + vLLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "nemoguardrails>=0.17",
]

[project.optional-dependencies]
# GPU training stack (Colab / cloud GPU). Not needed to run the API.
train = [
  "torch>=2.3",
  "transformers>=4.46",
  "peft>=0.13",
  "trl>=0.20",
  "bitsandbytes>=0.43",
  "accelerate>=0.34",
  "datasets>=2.20",
  "pyyaml>=6",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "datasets>=2.20",
  "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "rails: tests that load the real NeMo Guardrails runtime (downloads a small embedding model on first run)",
]
