# QLoRA SFT of Gemma-2 on anxiety-focused CBT dialogues (CACTUS).
# Defaults fit a single 16 GB GPU (Colab T4 / L4). On A100 raise batch size and max_train_samples.

model_id: google/gemma-2-2b-it          # gated: accept the licence on the HF model page first
data_dir: data/processed
output_dir: outputs/gemma2-cbt-qlora

max_train_samples: 4000                 # null = all ~12.3k conversations (~3x longer)
max_eval_samples: 200
max_length: 2048                        # covers most CACTUS dialogues (~1.2k tokens mean)

# 4-bit NF4 quantisation of the frozen base (QLoRA)
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

# LoRA adapter
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Optimisation
num_train_epochs: 1
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
per_device_train_batch_size: 2
gradient_accumulation_steps: 8          # effective batch = 16 conversations
per_device_eval_batch_size: 2
optim: paged_adamw_8bit
weight_decay: 0.0
max_grad_norm: 0.3
gradient_checkpointing: true
assistant_only_loss: true               # loss only on counselor turns
logging_steps: 10
eval_steps: 100
save_steps: 100
seed: 42
report_to: none                         # set to "wandb" or "tensorboard" if wanted
